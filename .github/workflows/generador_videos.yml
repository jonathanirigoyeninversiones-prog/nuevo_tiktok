name: Generador de Videos Automatizado

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
    construir-y-ejecutar:
      runs-on: ubuntu-latest
      steps:
        - name: Clonar repositorio
          uses: actions/checkout@v4
  
        - name: Configurar entorno de Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'
  
        - name: Instalar dependencias del sistema (ImageMagick)
          run: |
            sudo apt-get update
            sudo apt-get install -y imagemagick
  
        - name: Instalar dependencias de Python a la fuerza
          run: |
            python -m pip install --upgrade pip
            python -m pip install requests moviepy pillow numpy
  
        - name: Ejecutar script del profesor
          run: |
            export PYTHONPATH=$PYTHONPATH:$(pwd)
            python src/profesor.py
